[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opensent"
version = "0.1.0"
description = "Open SAE J2716 SENT toolkit: sensor emulator, decoder, SENT-to-analog bridge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["pyserial>=3.4"]
keywords = ["SENT", "SAE J2716", "automotive", "sensor", "sigrok", "STM32"]

[project.scripts]
opensent = "opensent.cli:main"

[tool.setuptools]
packages = ["opensent"]
